<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The content-security policy is injected into production builds by vite.config.ts,
         because the dev server needs inline scripts and a websocket for hot reload. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#063231" />
    <!-- prerender:head:begin — everything between these two comments is replaced
         at build time by .tools/prerender.mjs, which generates it from
         src/lib/pageMeta.ts for the page this file becomes. What is written here
         by hand is only the homepage's title and description: enough for the dev
         server, and the address a local build's canonical points at. Every
         published page is served a canonical, an Open Graph card and a JSON-LD
         block naming that page, and MetaManager updates them when a visitor
         moves between pages inside the app. -->
    <title>Karachify — Discover Everything Karachi</title>
    <meta
      name="description"
      content="A city directory for Karachi with per-field sources: every address, opening hour, price and phone number is either linked to the page it was read from or labelled unverified — never guessed."
    />
    <link rel="canonical" href="https://mbilalecom4.github.io/karachify/" />
    <!-- prerender:head:end -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23102A43'/%3E%3Cpath d='M8 22V10h3v5l5-5h3.6l-5.2 5.4L22.6 22H18.6l-4.4-4.8L11 19.6V22z' fill='%2313A89E'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://thumb.wikimedia.org" crossorigin />
    <link rel="preconnect" href="https://upload.wikimedia.org" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
